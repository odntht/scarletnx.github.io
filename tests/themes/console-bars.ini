; a test theme, tests/frames.js: its console theme: no head, a footer bar under a rule, the focus in colour, every prompt line framed
; at the left and steady, a sliding description
[theme]
format = 1
name = Console bars
author = Aogo
base = default
[colors]
page = #102030
ink = #E0E0D0
soft = #80A0B0
focus = #F0C040
active = #40E0A0
failure = #FF6060
dim = #304050
warning = #FFA040
[head]
style = none
rule = true
menu = NEVER SHOWN
[body]
marker = ">> "
focus = color
[footer]
style = bar
rule = true
[run]
layout = console
[prompt]
align = left
open = "<"
close = ">"
blink = false
keys = true
done = true
failed = true
aborting = true
[transitions]
fade_in_ms = 300
fade_out_ms = 400
blink_ms = 700
scroll_ms = 90
