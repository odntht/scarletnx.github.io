; a test theme, tests/frames.js: its fading steps: the ring right after the name, lines fading in, no step details, the bar, no footer,
; a head bar and a focus band, a marker the font has and one it lacks, centred steady prompts
[theme]
format = 1
name = Near fade
author = Aogo
base = default
[colors]
page = #000820
ink = #C0D0FF
soft = #6070A0
focus = #FFE080
active = #FF80C0
failure = #FF4040
dim = #203050
warning = #FFB000
[head]
style = bar
rule = false
menu = "NEAR FADE "
compiling = BUILDING
loading = STARTING
[body]
marker = "»→ "
focus = bar
[footer]
style = none
rule = true
[run]
layout = steps
page = #050505
ink = #F0F0F0
soft = #909090
dim = #404040
failure = #FF3030
warning = #FFC000
texture = true
bar = true
detailed = false
collapse = false
ring = right-near-text
[prompt]
align = center
open = "[["
close = "]]"
blink = false
keys = true
done = true
failed = false
aborting = true
[transitions]
fade_in_ms = 200
fade_out_ms = 300
line_in = fade
line_in_ms = 600
blink_ms = 250
scroll_ms = 0
