; a test theme, tests/frames.js: its ErET theme: layout = loading and no base, so YoRHa with [colors] the run's; the ring from
; [header] ring_side, the boot word from [loading] title, async typing, details kept
[theme]
format = 1
name = ErET loading
author = Aogo
layout = loading
[colors]
page = #201010
ink = #FFE0C0
soft = #A08070
dim = #503030
failure = #FF5050
warning = #FFD050
texture = false
[header]
ring_side = left
[loading]
title = NOW LOADING
[run]
bar = true
[transitions]
line_in = typing
typing = async
typing_ms = 12
blink_ms = 400
fade_in_ms = 150
fade_out_ms = 250
