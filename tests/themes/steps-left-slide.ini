; a test theme, tests/frames.js: its sliding steps: the ring at the left, the bar, steps folded once done, lines sliding in, prompts at the
; right, titles long enough to slide the name, a plain head and footer with rules, the focus in colour
[theme]
format = 1
name = Left slide
author = Aogo
base = yorha
[colors]
page = #F4F0E8
ink = #202830
soft = #708090
focus = #C03030
active = #2070C0
failure = #B02020
dim = #C0C0B0
warning = #A07010
[head]
style = plain
rule = true
menu = LEFT SLIDE  /  MENU
games = LEFT SLIDE  /  GAMES
keys = LEFT SLIDE  /  KEYS
compiling = "  COMPILING, WITH A TITLE AS LONG AS THE GUI TAKES IN: 63 BYTES"
loading = BOOTING, AND A TITLE AS LONG AS THE GUI EVER TAKES IN: 63 BYTES
[body]
marker = "* "
focus = color
[footer]
style = plain
rule = true
[run]
layout = steps
page = #0A1020
ink = #F0F0E0
soft = #7080A0
dim = #304060
failure = #F05050
warning = #F0C050
texture = false
bar = true
detailed = true
collapse = true
ring = left
[prompt]
align = right
open = "-> "
close = " <-"
blink = true
keys = false
done = true
failed = true
aborting = true
[transitions]
fade_in_ms = 0
fade_out_ms = 0
line_in = slide
line_in_ms = 400
blink_ms = 300
scroll_ms = 100
