# The site's checks: valid HTML, no CSS anywhere (Lizzie's rule), JavaScript that parses, and the theme builder's tests,
# which also fetch ScarletNX's main: its built-in themes and the GUI code theme/builder.js copies. Weekly too, so a
# change on main shows up here even when the site does not move.
name: Check
on:
  push:
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: No CSS
        run: node tools/zero-css.js
      - name: HTML
        run: git ls-files -z '*.html' | xargs -0 npx --yes html-validate@11.16.1
      - name: JavaScript parses
        run: |
          for f in $(git ls-files '*.js' '*.mjs' '*.cjs'); do
            node --check "$f" || { echo "::error file=$f::$f does not parse"; exit 1; }
          done
      - name: Theme builder tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --test tests/*.test.js
